media:
  - name: images
    label: Images
    input: static/images
    output: /images
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif, svg]
    rename: safe

content:
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, categories, featured, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: date
        label: Date de publication
        type: date
        required: true
      - name: draft
        label: Brouillon
        type: boolean
        default: true
      - name: featured
        label: À la une
        type: boolean
        default: false
        description: "Activer pour proposer cet article dans la sélection de la page d'accueil. Six articles au maximum seront affichés."
      - name: description
        label: Résumé
        type: text
      - name: categories
        label: Rubriques
        type: select
        required: true
        description: "Choisir une ou plusieurs rubriques. Pour ajouter une nouvelle rubrique, elle devra d'abord être créée dans Pages du blog → Rubriques et ajoutée ici dans la liste."
        options:
          multiple: true
          min: 1
          values:
            - Culture
            - Talents
            - Digital
            - Société
            - Créativité
            - Vibrance
      - name: subcategory
        label: Sous-rubrique
        type: select
        description: "Facultatif. Les choix sont regroupés par rubrique principale. Sélectionner une sous-rubrique cohérente avec la rubrique choisie ci-dessus."
        options:
          values:
            - name: Musique & scène
              label: "Culture — Musique & scène"
            - name: Cinéma & audiovisuel
              label: "Culture — Cinéma & audiovisuel"
            - name: Livres & patrimoine
              label: "Culture — Livres & patrimoine"
            - name: Portraits
              label: "Talents — Portraits"
            - name: Parcours & métiers
              label: "Talents — Parcours & métiers"
            - name: Initiatives
              label: "Talents — Initiatives"
            - name: Intelligence artificielle
              label: "Digital — Intelligence artificielle"
            - name: Innovation & tech
              label: "Digital — Innovation & tech"
            - name: Usages numériques
              label: "Digital — Usages numériques"
            - name: Jeunesse & éducation
              label: "Société — Jeunesse & éducation"
            - name: Économie & société
              label: "Société — Économie & société"
            - name: Environnement & citoyenneté
              label: "Société — Environnement & citoyenneté"
            - name: Design & identité visuelle
              label: "Créativité — Design & identité visuelle"
            - name: Photographie & vidéo
              label: "Créativité — Photographie & vidéo"
            - name: Mode & création
              label: "Créativité — Mode & création"
            - name: Visages
              label: "Vibrance — Visages"
            - name: Parcours singuliers
              label: "Vibrance — Parcours singuliers"
            - name: Talents émergents
              label: "Vibrance — Talents émergents"
      - name: tags
        label: Mots-clés
        type: string
        list: true
        description: "Saisir un mot-clé par entrée. Ne pas séparer plusieurs mots-clés par des virgules."
      - name: author
        label: Auteur
        type: string
        default: FA COMMUNICATION
      - name: cover
        label: Image de couverture
        type: image
        options:
          media: images
      - name: video_url
        label: Vidéo YouTube (facultative)
        type: string
        description: "Coller le lien YouTube complet. La vidéo s'ouvre uniquement après un clic du lecteur."
      - name: video_title
        label: Titre de la vidéo
        type: string
        description: "Facultatif. Un titre éditorial court pour présenter la vidéo."
      - name: video_caption
        label: Légende de la vidéo
        type: text
        description: "Facultatif. Expliquer en une phrase ce que le lecteur va découvrir."
      - name: vibrance_intro
        label: "Vibrance — 1. Le portrait"
        type: rich-text
        description: "Pour les articles Vibrance uniquement : présenter la personnalité et ce qui la rend singulière."
        options:
          format: markdown
          media: images
          path: articles
      - name: vibrance_intro_image
        label: "Vibrance — Image — Le portrait"
        type: image
        options:
          media: images
      - name: vibrance_origins
        label: "Vibrance — 2. Les origines et le déclic"
        type: rich-text
        description: "Pour les articles Vibrance uniquement : raconter les racines, les influences et le moment déclencheur."
        options:
          format: markdown
          media: images
          path: articles
      - name: vibrance_origins_image
        label: "Vibrance — Image — Les origines et le déclic"
        type: image
        options:
          media: images
      - name: vibrance_journey
        label: "Vibrance — 3. Le parcours"
        type: rich-text
        description: "Pour les articles Vibrance uniquement : retracer les étapes, les choix et les défis."
        options:
          format: markdown
          media: images
          path: articles
      - name: vibrance_journey_image
        label: "Vibrance — Image — Le parcours"
        type: image
        options:
          media: images
      - name: vibrance_vision
        label: "Vibrance — 4. Les convictions et les projets"
        type: rich-text
        description: "Pour les articles Vibrance uniquement : partager la vision, les engagements et les projets."
        options:
          format: markdown
          media: images
          path: articles
      - name: vibrance_vision_image
        label: "Vibrance — Image — Les convictions et les projets"
        type: image
        options:
          media: images
      - name: vibrance_spark
        label: "Vibrance — 5. L'éclat"
        type: rich-text
        description: "Pour les articles Vibrance uniquement : révéler la signature personnelle, ce qui fait la différence et le message à retenir."
        options:
          format: markdown
          media: images
          path: articles
      - name: vibrance_spark_image
        label: "Vibrance — Image — L'éclat"
        type: image
        options:
          media: images
      - name: body
        label: Contenu de l'article
        type: rich-text
        options:
          format: markdown
          media: images
          path: articles

