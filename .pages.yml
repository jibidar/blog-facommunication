  - name: subcategories
    label: Sous-rubriques
    type: collection
    path: content/categories
    subfolders: true
    exclude: ["_index.md"]
    format: yaml-frontmatter
    filename: "{parentCategory}/{slug}.md"
    view:
      fields: [title, parentCategory, weight]
      primary: title
      sort: [parentCategory, weight, title]
      layout: tree
    fields:
      - name: title
        label: Nom de la sous-rubrique
        type: string
        required: true
      - name: parentCategory
        label: Rubrique principale
        type: select
        required: true
        options:
          values:
            - Culture
            - Talents
            - Digital
            - Société
            - Créativité
            - Vibrance
      - name: description
        label: Description
        type: text
      - name: weight
        label: Ordre d'affichage
        type: number
      - name: body
        label: Présentation
        type: rich-text
        options:
          format: markdown
          media: images
          path: pages

settings:
  content:
    merge: true
