media:
  - name: images
    label: Images
    input: static/images
    output: /images
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif, svg]
    rename: safe

content:
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, categories, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: date
        label: Date de publication
        type: date
        required: true
      - name: draft
        label: Brouillon
        type: boolean
        default: true
      - name: description
        label: Résumé
        type: text
      - name: categories
        label: Rubriques
        type: select
        required: true
        description: "Choisir une ou plusieurs rubriques. Pour ajouter une nouvelle rubrique, elle devra d'abord être créée dans Pages du blog → Rubriques et ajoutée ici dans la liste."
        options:
          multiple: true
          min: 1
          values:
            - Culture
            - Talents
            - Digital
            - Société
            - Créativité
            - Vibrance
      - name: tags
        label: Mots-clés
        type: string
        list: true
        description: "Saisir un mot-clé par entrée. Ne pas séparer plusieurs mots-clés par des virgules."
      - name: author
        label: Auteur
        type: string
        default: FA Communication
      - name: cover
        label: Image de couverture
        type: image
        options:
          media: images
      - name: body
        label: Contenu de l'article
        type: rich-text
        options:
          format: markdown
          media: images
          path: articles

  - name: editorial-pages
    label: Pages du blog
    type: group
    items:
      - name: about
        label: À propos
        type: file
        path: content/a-propos.md
        format: yaml-frontmatter
        operations:
          delete: false
        fields:
          - name: title
            label: Titre
            type: string
            required: true
          - name: description
            label: Description SEO
            type: text
          - name: body
            label: Contenu
            type: rich-text
            options:
              format: markdown
              media: images
              path: pages

      - name: contact
        label: Contact
        type: file
        path: content/contact.md
        format: yaml-frontmatter
        operations:
          delete: false
        fields:
          - name: title
            label: Titre
            type: string
            required: true
          - name: description
            label: Description SEO
            type: text
          - name: body
            label: Contenu
            type: rich-text
            options:
              format: markdown
              media: images
              path: pages

      - name: legal
        label: Mentions légales (brouillon)
        type: file
        path: content/mentions-legales.md
