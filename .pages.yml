media:
  - name: images
    label: Images
    input: static/images
    output: /images
    categories: [image]
    extensions: [png, jpg, jpeg, webp, gif, svg]
    rename: safe

content:
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, categories, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: date
        label: Date de publication
        type: date
        required: true
      - name: draft
        label: Brouillon
        type: boolean
        default: true
      - name: description
        label: Résumé
        type: text
      - name: categories
        label: Rubrique
        type: string
        list: true
        required: true
        description: "Saisir une rubrique existante : Culture, Talents, Digital, Société, Créativité ou Vibrance. De nouvelles rubriques pourront être ajoutées."
      - name: tags
        label: Mots-clés
        type: string
        list: true
      - name: author
        label: Auteur
        type: string
        default: FA Communication
      - name: cover
        label: Image de couverture
        type: image
        options:
          media: images
      - name: body
        label: Contenu de l'article
        type: rich-text
        options:
          format: markdown
          media: images
          path: articles
