name: Validate Hugo build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.170.1
          extended: true

      - name: Validate Pages CMS configuration syntax
        run: ruby -e 'require "yaml"; YAML.load_file(".pages.yml"); puts "Pages CMS YAML is valid"'

      - name: Check search script syntax
        run: node --check assets/js/search.js

      - name: Build site including editorial drafts
        run: hugo --buildDrafts --minify

      - name: Verify essential pages and feeds
        run: |
          set -eu
          test -s public/index.html
          test -s public/articles/index.html
          grep -q 'aria-current="page">Articles' public/articles/index.html
          test -s public/categories/index.html
          grep -q 'aria-current="page">Culture' public/categories/culture/index.html
          grep -o '<!-- DEBUG[^>]*-->' public/categories/culture/livres-patrimoine/index.html || true
          grep -q 'Autres sous-rubriques de Culture' public/categories/culture/livres-patrimoine/index.html
          grep -q 'href="/categories/culture/">Culture</a>' public/categories/culture/livres-patrimoine/index.html
          grep -q 'aria-current="page">Livres &amp; patrimoine' public/categories/culture/livres-patrimoine/index.html
          test -s public/categories/culture/index.html
          test -s public/categories/talents/index.html
          test -s public/categories/digital/index.html
          test -s public/categories/societe/index.html
          test -s public/categories/creativite/index.html
          test -s public/categories/vibrance/index.html
          test "$(find public/categories -mindepth 3 -maxdepth 3 -name index.html | wc -l)" -eq 18
          test -s public/images/wo/wo.png
          test -s public/favicon.svg
          test -s public/a-propos/index.html
          test -s public/contact/index.html
          test -s public/recherche/index.html
          test -s public/404.html
          test -s public/index.json
          test -s public/index.xml
          test -s public/sitemap.xml
          test -s public/robots.txt
          python -m json.tool public/index.json > /dev/null
          grep -q "Wo : la curiosité de rester en éveil" public/articles/index.html

      - name: Verify production excludes editorial drafts
        run: |
          set -eu
          hugo --minify --destination public-production
          test -s public-production/index.html
          test -s public-production/recherche/index.html
          test -s public-production/mentions-legales/index.html
          test -s public-production/confidentialite/index.html
          ! grep -q "Wo : la curiosité de rester en éveil" public-production/index.json
