name: Validate Hugo build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.170.1
          extended: true

      - name: Validate Pages CMS configuration syntax
        run: ruby -e 'require "yaml"; YAML.load_file(".pages.yml"); puts "Pages CMS YAML is valid"'

      - name: Check search script syntax
        run: node --check assets/js/search.js

      - name: Build site including editorial drafts
        run: hugo --buildDrafts --minify

      - name: Verify essential pages and feeds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          checks = []
          def exists(path):
              checks.append((f"file {path}", Path(path).is_file() and Path(path).stat().st_size > 0))
          def contains(path, text):
              content = Path(path).read_text(encoding="utf-8")
              checks.append((f"{path} contains {text!r}", text in content))

          for path in [
              "public/index.html", "public/articles/index.html",
              "public/categories/index.html", "public/categories/culture/index.html",
              "public/categories/talents/index.html", "public/categories/digital/index.html",
              "public/categories/societe/index.html", "public/categories/creativite/index.html",
              "public/categories/vibrance/index.html", "public/images/wo/wo.png",
              "public/favicon.svg", "public/a-propos/index.html", "public/contact/index.html",
              "public/recherche/index.html", "public/404.html", "public/index.json",
              "public/index.xml", "public/sitemap.xml", "public/robots.txt"
          ]:
              exists(path)

          contains("public/articles/index.html", 'aria-current="page">Articles')
          contains("public/categories/culture/index.html", 'aria-current="page">Culture')
          contains("public/categories/culture/livres-patrimoine/index.html", 'href=/categories/culture/>Culture</a>')
          contains("public/categories/culture/livres-patrimoine/index.html", 'aria-current=page>Livres & patrimoine')
          contains("public/categories/culture/livres-patrimoine/index.html", 'Autres sous-rubriques de Culture')
          contains("public/articles/index.html", "Wo : la curiosité de rester en éveil")

          try:
              json.loads(Path("public/index.json").read_text(encoding="utf-8"))
              checks.append(("public/index.json is valid JSON", True))
          except Exception as exc:
              checks.append((f"public/index.json is valid JSON ({exc})", False))

          subcategory_count = len(list(Path("public/categories").glob("*/*/index.html")))
          checks.append((f"18 subcategory pages (found {subcategory_count})", subcategory_count == 18))

          for label, ok in checks:
              print(("OK   " if ok else "FAIL ") + label)
          failures = [label for label, ok in checks if not ok]
          if failures:
              raise SystemExit(f"{len(failures)} validation(s) failed: " + "; ".join(failures))
          PY

      - name: Verify production excludes editorial drafts
        run: |
          set -eu
          hugo --minify --destination public-production
          test -s public-production/index.html
          test -s public-production/recherche/index.html
          test -s public-production/mentions-legales/index.html
          test -s public-production/confidentialite/index.html
          ! grep -q "Wo : la curiosité de rester en éveil" public-production/index.json

